<!DOCTYPE html>
<html>
<head>
  <title>Victor AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
    }

    input {
      width: 90%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 15px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #answer {
      margin-top: 20px;
      text-align: left;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 8px;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🤖 Victor AI</h1>
    <p>Your Personal AI Assistant</p>

    <input
      id="question"
      placeholder="Ask Victor AI anything..."
    >

    <br>

    <button onclick="askVictor()">
      Ask Victor AI
    </button>

    <div id="answer">
      Victor AI is ready. Ask me a question!
    </div>
  </div>

  <script>
    async function askVictor() {
      const question = document.getElementById("question").value;
      const answer = document.getElementById("answer");

      if (question.trim() === "") {
        answer.innerText = "Please type a question first.";
        return;
      }

      answer.innerText = "Victor AI is thinking... 🧠";

      try {
        const response = await fetch("/.netlify/functions/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        answer.innerText = data.answer;

      } catch (error) {
        answer.innerText =
          "Sorry, something went wrong. Please try again.";
      }
    }
  </script>

</body>
</html>
